<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>警訊總覽 - 財報健檢</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">📈 財報健檢儀表板</div>
      <nav class="nav-links">
        <a href="index.html">已查詢股票</a>
        <a href="alerts.html">警訊總覽</a>
        <a href="details.html">個股詳情</a>
        <a href="portfolio.html">投資組合健檢</a>
        <a href="rules.html">規則與說明</a>
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
  </header>
  <main class="has-toc">
   <div class="toc-layout">
    <!-- 公司導覽：寬螢幕固定在左側，窄螢幕變成頂部可橫向捲動的列 -->
    <aside class="page-toc" id="alerts-toc" aria-label="自選公司導覽">
      <p class="page-toc-title">自選公司<span id="alerts-toc-count"></span></p>
      <ul id="alerts-toc-list"></ul>
    </aside>
    <div class="toc-main">
    <div class="card flex-between" style="margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
      <h3>⚠️ 觸發警訊總覽</h3>
      <select id="alert-filter" onchange="renderAlerts()">
        <option value="group" selected>依公司分組</option>
        <option value="severity">依嚴重程度排序</option>
        <option value="red">僅顯示紅燈 (警戒)</option>
        <option value="yellow">僅顯示黃燈 (注意)</option>
      </select>
    </div>
    <div id="alerts-list"></div>
    <div id="alerts-empty" class="empty-state" style="display:none;">
      <p>載入中…</p>
    </div>
    </div><!-- /.toc-main -->
   </div><!-- /.toc-layout -->
  </main>
  <footer class="site-footer">本網站資料來自公開資訊（FinMind、證交所、櫃買中心、MoneyDJ），依財報數據自動計算，可能有延遲或誤差；所有內容僅供參考，不構成投資建議。</footer>

  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
  <script> initAlerts(); </script>
</body>
</html>
