<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>個股詳情 - 財報健檢</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">📈 財報健檢儀表板</div>
      <nav class="nav-links">
        <a href="index.html">我的自選股</a>
        <a href="alerts.html">警訊總覽</a>
        <a href="details.html">個股詳情</a>
        <a href="rules.html">規則與說明</a>
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
  </header>
  <main>
    <div class="flex-between" style="margin-bottom: 16px;">
      <a href="index.html" class="btn-outline" style="text-decoration:none;">← 返回自選股</a>
      <select id="detail-stock-select" onchange="changeDetailStock(this.value)"></select>
    </div>

    <div id="detail-list-view" style="display: block;">
      <h3 style="margin-bottom: 16px;">請選擇要查看詳情的股票：</h3>
      <div id="detail-stock-list" class="grid-3"></div>
      <div id="detail-list-empty" class="empty-state" style="display:none;">
        <p>目前自選股清單為空，請先到首頁新增股票。</p>
      </div>
    </div>

    <div id="detail-content" style="display:none;">
      <div class="card" style="margin-bottom: 16px;">
        <div class="flex-between">
          <div>
            <h2 id="detail-name" style="margin-bottom: 8px;">--</h2>
            <p class="status-indicator"><span id="detail-dot" class="dot"></span> <span id="detail-status-text">--</span></p>
          </div>
          <div style="text-align: right; color: var(--text-light); font-size: 0.9rem;">
            <p id="detail-industry">產業: --</p>
          </div>
        </div>
        
        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
          <label for="company-type-select" style="color: var(--text-light); font-size: 0.9rem;">檢驗標準覆蓋：</label>
          <select id="company-type-select" style="padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text);" onchange="overrideCompanyType(window.currentStockId, this.value)">
            <option value="general">一般</option>
            <option value="electronics">電子製造/半導體</option>
            <option value="cyclical">傳產/景氣循環</option>
            <option value="growth">成長股</option>
            <option value="dividend">高股息/存股型</option>
            <option value="financial">金融業</option>
          </select>
          <p id="company-type-desc" style="font-size: 0.85rem; color: var(--text-light); margin-top: 8px;">--</p>
        </div>
        
        <div id="detail-plain-summary" style="margin-top: 16px;"></div>
        <div id="detail-qoq"></div>

        <!-- 歷史風險分數折線圖區塊 (新增) -->
        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border);">
            <h4 style="margin-bottom: 8px; display:flex; justify-content:space-between; align-items:center;">
                近 8 季風險分數趨勢
                <span style="font-size: 0.8rem; color: var(--text-light); font-weight: normal;">*分數僅納入有資料的規則</span>
            </h4>
            <div class="chart-container" style="height: 180px;"><canvas id="chart-risk"></canvas></div>
        </div>

        <div id="detail-alerts-summary" style="margin-top: 12px; font-size: 0.9rem;"></div>
      </div>

      <div class="card" id="radar-card" style="margin-bottom: 16px;">
        <h3 style="margin-bottom: 16px;">健康度雷達圖</h3>
        <div id="radar-container" class="flex-between" style="align-items: center; gap: 24px;">
            <div style="flex:2; max-width:500px; position:relative; min-height:300px;"><canvas id="chart-radar"></canvas></div>
            <div id="radar-score-list" style="flex:1;"></div>
        </div>
        <div id="radar-financial-msg" class="empty-state" style="display:none; margin: 24px 0;"></div>
      </div>

      <div class="card">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchDetailTab('income')">損益表</button>
          <button class="tab-btn" onclick="switchDetailTab('balance')">財務狀況表</button>
          <button class="tab-btn" onclick="switchDetailTab('cashflow')">現金流量表</button>
        </div>

        <div id="tab-income" class="tab-content active">
          <div class="chart-container"><canvas id="chart-revenue"></canvas></div>
          <h4 style="margin-top: 24px;">損益表數據明細</h4>
          <div class="table-responsive">
            <table id="table-income">
              <!-- 擴充了營業利益、營業外收支欄位 -->
              <thead><tr><th>季度</th><th>營收(百萬)</th><th>年增率</th><th>毛利率</th><th>營業利益(百萬)</th><th>營益率</th><th>營業外收支(百萬)</th><th>淨利(百萬)</th><th>EPS</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div id="tab-balance" class="tab-content">
          <div class="chart-container" style="margin-bottom:16px;"><canvas id="chart-balance"></canvas></div>
          <!-- 新增利息保障與速動比率專屬圖表 -->
          <div class="chart-container" style="border-top:1px dashed var(--border); padding-top:16px;"><canvas id="chart-balance-2"></canvas></div>
          <h4 style="margin-top: 24px;">財務狀況表數據明細</h4>
          <div class="table-responsive">
            <table id="table-balance">
              <!-- 擴充了速動比率、利息保障倍數 -->
              <thead><tr><th>季度</th><th>負債比</th><th>流動比</th><th>速動比率</th><th>利息保障倍數</th><th>應收天數</th><th>存貨天數</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div id="tab-cashflow" class="tab-content">
          <div class="chart-container"><canvas id="chart-cf"></canvas></div>
          <h4 style="margin-top: 24px;">現金流量表數據明細</h4>
          <div class="table-responsive">
            <table id="table-cashflow">
              <!-- 擴充了融資現金流、期末現金 -->
              <thead><tr><th>季度</th><th>營業現金流(百萬)</th><th>融資現金流(百萬)</th><th>自由現金流(百萬)</th><th>期末現金(百萬)</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
  <script> initDetails(); </script>
</body>
</html>
