<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
  <meta charset="UTF-8">
  <title>台股財報健檢儀表板</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">📈 財報健檢儀表板</div>
      <nav class="nav-links">
        <a href="index.html">我的自選股</a>
        <a href="alerts.html">警訊總覽</a>
        <a href="details.html">個股詳情</a>
        <a href="rules.html">規則與說明</a>
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()" title="切換深淺色">🌓</button>
    </div>
  </header>
  <main>
    <div class="card flex-between" style="flex-wrap: wrap; gap: 12px;">
      <div>
        <!-- 修改 1：將 placeholder 範例改為 2330 -->
        <input type="text" id="stock-input" placeholder="輸入股票代號 (例: 2330)" maxlength="4" onkeypress="if(event.key==='Enter') addStock()">
        <button class="btn-primary" onclick="addStock()">新增</button>
      </div>
      <div>
        <!-- 修改 2：將「依股票代號排序」放在第一順位，並加上 selected 設為預設值 -->
        <select id="sort-select" onchange="renderPortfolio()">
          <option value="id" selected>依股票代號排序</option>
          <option value="severity">依燈號嚴重程度排序</option>
        </select>
      </div>
    </div>
    
    <div id="portfolio-grid" class="grid-3"></div>
    
    <div id="portfolio-empty" class="empty-state" style="display:none;">
      <h3>尚無追蹤股票</h3>
      <!-- 提示文字的範例也一併改為真實股票 -->
      <p>請在上方輸入股票代號開始追蹤 (例: 2330, 2317, 2887)</p>
    </div>
  </main>
  
  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
  <script> initPortfolio(); </script>
</body>
</html>
