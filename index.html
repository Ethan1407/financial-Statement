<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台股財報健檢儀表板</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">📈 財報健檢儀表板</div>
      <nav class="nav-links">
        <a href="index.html">已查詢股票</a>
        <a href="alerts.html">警訊總覽</a>
        <a href="details.html">個股詳情</a>
        <a href="portfolio.html">投資組合健檢</a>
        <a href="rules.html">規則與說明</a>
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()" title="切換深淺色">🌓</button>
    </div>
  </header>
  <main>
    <div class="card flex-between" style="flex-wrap: wrap; gap: 12px;">
      <div>
        <input type="text" id="stock-input" placeholder="輸入股票或 ETF 代號 (例: 2330、0050)" maxlength="6" onkeypress="if(event.key==='Enter') addStock()">
        <button class="btn-primary" onclick="addStock()">加入自選股</button>
      </div>
      <div>
        <select id="sort-select" onchange="renderStockOverview()">
          <option value="id" selected>依股票代號排序</option>
          <option value="severity">依燈號嚴重程度排序</option>
        </select>
      </div>
    </div>

    <section id="tracked-section">
      <h2 class="section-title">
        ⭐ 自選股 <span class="section-count" id="tracked-count"></span>
        <button class="section-toggle" id="tracked-toggle" onclick="toggleSection('tracked')" aria-expanded="true" title="展開／收合">▼</button>
      </h2>
      <div id="tracked-body">
        <div id="tracked-grid" class="grid-3"></div>
        <p id="tracked-empty" class="empty-state" style="display:none;"></p>
      </div>
    </section>

    <section id="others-section" style="display:none;">
      <h2 class="section-title">
        📄 其他已查詢股票 <span class="section-count" id="others-count"></span>
        <button class="section-toggle" id="others-toggle" onclick="toggleSection('others')" aria-expanded="true" title="展開／收合">▼</button>
      </h2>
      <div id="others-body">
        <p class="section-hint">曾查詢過、但未加入自選股的公司與 ETF（例如從 ETF 成分股點入，或移出自選股）。</p>
        <div id="others-grid" class="grid-3"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer">本網站資料來自公開資訊（FinMind、證交所、櫃買中心、MoneyDJ），依財報數據自動計算，可能有延遲或誤差；所有內容僅供參考，不構成投資建議。</footer>

  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
  <script src="js/etf.js"></script>
  <script> renderStockOverview(); </script>
</body>
</html>
