<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>台股財報健檢儀表板</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">📈 財報健檢儀表板</div>
      <nav class="nav-links">
        <a href="index.html"><span class="nav-icon" aria-hidden="true">📋</span><span class="nav-full">已查詢股票</span><span class="nav-short">已查詢</span></a>
        <a href="prices.html"><span class="nav-icon" aria-hidden="true">💹</span><span class="nav-full">股價走勢</span><span class="nav-short">股價</span></a>
        <a href="alerts.html"><span class="nav-icon" aria-hidden="true">🚨</span><span class="nav-full">警訊總覽</span><span class="nav-short">警訊</span></a>
        <a href="details.html"><span class="nav-icon" aria-hidden="true">🔎</span><span class="nav-full">個股詳情</span><span class="nav-short">個股</span></a>
        <a href="portfolio.html"><span class="nav-icon" aria-hidden="true">🧺</span><span class="nav-full">投資組合健檢</span><span class="nav-short">組合健檢</span></a>
        <a href="rules.html"><span class="nav-icon" aria-hidden="true">📖</span><span class="nav-full">規則與說明</span><span class="nav-short">規則</span></a>
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()" title="切換深淺色">🌓</button>
    </div>
  </header>
  <main class="has-toc">
   <div class="toc-layout">
    <!-- 區塊導覽：寬螢幕固定在左側，窄螢幕變成頂部可橫向捲動的列 -->
    <aside class="page-toc" id="home-toc" aria-label="頁面區塊導覽">
      <p class="page-toc-title">本頁區塊</p>
      <ul>
        <li><a href="#tracked-section" data-key="tracked-section"><span class="page-toc-label">⭐ 自選股</span><span class="page-toc-num" id="toc-tracked-count"></span></a></li>
        <li><a href="#etf-section" data-key="etf-section"><span class="page-toc-label">🧺 ETF</span><span class="page-toc-num" id="toc-etf-count"></span></a></li>
        <li><a href="#others-section" data-key="others-section"><span class="page-toc-label">📄 其他已查詢股票</span><span class="page-toc-num" id="toc-others-count"></span></a></li>
        <li><a href="#rec-section" data-key="rec-section"><span class="page-toc-label">🔍 推薦的同類型公司</span></a></li>
      </ul>
    </aside>
    <div class="toc-main">
    <div class="card flex-between" style="flex-wrap: wrap; gap: 12px;">
      <div>
        <div class="stock-search">
          <input type="text" id="stock-input" placeholder="代號或名稱，例：2330、台積電" maxlength="20">
          <button class="btn-primary" id="add-stock-btn" onclick="addStock()">加入自選股</button>
        </div>
        <p class="stock-input-hint" id="stock-input-hint" aria-live="polite"></p>
      </div>
      <div>
        <select id="sort-select" onchange="renderStockOverview()">
          <option value="id" selected>依股票代號排序</option>
          <option value="severity">依燈號嚴重程度排序</option>
        </select>
      </div>
    </div>

    <section id="tracked-section">
      <h2 class="section-title">
        ⭐ 自選股 <span class="section-count" id="tracked-count"></span>
        <button class="section-toggle" id="tracked-toggle" onclick="toggleSection('tracked')" aria-expanded="true" title="展開／收合">▼</button>
      </h2>
      <div id="tracked-body">
        <div id="tracked-grid" class="grid-3"></div>
        <p id="tracked-empty" class="empty-state" style="display:none;"></p>
      </div>
    </section>

    <section id="etf-section" style="display:none;">
      <h2 class="section-title">
        🧺 自選 ETF <span class="section-count" id="etf-count"></span>
        <button class="section-toggle" id="etf-toggle" onclick="toggleSection('etf')" aria-expanded="true" title="展開／收合">▼</button>
      </h2>
      <div id="etf-body">
        <div id="etf-grid" class="grid-3"></div>
      </div>
    </section>

    <section id="others-section" style="display:none;">
      <h2 class="section-title">
        📄 其他已查詢股票 <span class="section-count" id="others-count"></span>
        <button class="section-toggle" id="others-toggle" onclick="toggleSection('others')" aria-expanded="true" title="展開／收合">▼</button>
      </h2>
      <div id="others-body">
        <p class="section-hint">曾查詢過、但未加入自選股的公司與 ETF（例如從 ETF 成分股點入，或移出自選股）。</p>
        <div id="others-grid" class="grid-3"></div>
      </div>
    </section>

    <section id="rec-section">
      <h2 class="section-title">
        🔍 延伸研究：同類型公司
        <button class="section-toggle" id="rec-toggle" onclick="toggleSection('rec')" aria-expanded="true" title="展開／收合">▼</button>
      </h2>
      <div id="rec-body">
        <p class="section-hint" id="rec-reason"></p>
        <div id="rec-content"></div>
        <div id="rec-footer"></div>
      </div>
    </section>
    </div><!-- /.toc-main -->
   </div><!-- /.toc-layout -->
  </main>
  <footer class="site-footer">本網站資料來自公開資訊（FinMind、證交所、櫃買中心、MoneyDJ），依財報數據自動計算，可能有延遲或誤差；所有內容僅供參考，不構成投資建議。</footer>

  <script src="js/rules.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/etf.js"></script>
  <script src="js/recommend.js"></script>
  <script> renderStockOverview(); </script>
</body>
</html>
