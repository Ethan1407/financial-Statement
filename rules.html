<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>規則與說明 - 財報健檢</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">📈 財報健檢儀表板</div>
      <nav class="nav-links">
        <a href="index.html">我的自選股</a>
        <a href="alerts.html">警訊總覽</a>
        <a href="details.html">個股詳情</a>
        <a href="rules.html" class="active">規則與說明</a>
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
  </header>
  <main>
    <div class="card" style="margin-bottom: 24px;">
      <h2>系統基礎運作說明</h2>
      <p style="margin-top: 8px; color: var(--text-light); line-height: 1.6;">
        本系統資料來源為 FinMind API。判斷門檻會根據「公司產業類型」進行動態適配，以減少因為產業特性帶來的誤判。<br>
        最後更新時間：<span id="info-date" style="color:var(--primary); font-weight:bold;"></span> (最新財報季：<span id="info-q" style="font-weight:bold;">--</span>)
      </p>
    </div>

    <!-- 產業分類覆蓋規則表 -->
    <div class="card" style="margin-bottom: 24px;">
      <h3>🏢 產業類型檢驗差異</h3>
      <p style="margin: 8px 0 16px 0; color: var(--text-light); font-size: 0.9rem;">不同類型的公司套用以下不同標準。您可以在「個股詳情」中手動為公司更改類型。</p>
      <div class="table-responsive">
        <table>
          <thead>
            <tr><th style="width: 25%">公司類型</th><th>調整與覆蓋說明</th></tr>
          </thead>
          <tbody id="type-table-body">
            <!-- JS 動態生成 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 基礎警訊門檻表 -->
    <div class="card">
      <h3>⚠️ 基礎警訊判斷標準 (一般類型)</h3>
      <div class="table-responsive" style="margin-top: 16px;">
        <table>
          <thead>
            <tr><th style="width: 15%">嚴重程度</th><th style="width: 25%">警訊名稱</th><th>具體判斷條件與門檻</th></tr>
          </thead>
          <tbody id="rules-table-body">
            <!-- JS 動態生成 -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
  <script>
    function initRules() {
      const stockDatabase = JSON.parse(localStorage.getItem('stock_database') || '{}');
      let latestTime = null;
      let latestQ = null;
      
      portfolio.forEach(id => {
          const data = stockDatabase[id];
          if(data && data.fetchedAt) {
              if(!latestTime || new Date(data.fetchedAt) > new Date(latestTime)) latestTime = data.fetchedAt;
          }
          if(data && data.latestQuarter) {
              if(!latestQ || data.latestQuarter > latestQ) latestQ = data.latestQuarter;
          }
      });

      if (latestTime) {
          const d = new Date(latestTime);
          document.getElementById('info-date').innerText = d.toLocaleString('zh-TW');
          document.getElementById('info-q').innerText = latestQ || "未知";
      } else {
          document.getElementById('info-date').innerText = "尚未取得資料";
      }

      const typeBody = document.getElementById('type-table-body');
      typeBody.innerHTML = '';
      for (const key in TYPE_PROFILES) {
          const t = TYPE_PROFILES[key];
          typeBody.innerHTML += `<tr><td><strong>${t.label}</strong></td><td>${t.desc}</td></tr>`;
      }

      const rulesBody = document.getElementById('rules-table-body');
      rulesBody.innerHTML = '';
      for (const key in RULES_CONFIG) {
          const r = RULES_CONFIG[key];
          const badgeClass = r.level === 'red' ? 'red' : 'yellow';
          const badgeText = r.level === 'red' ? '紅燈 (警戒)' : '黃燈 (注意)';
          const desc = typeof r.why === 'function' ? r.why(r) : r.why;
          rulesBody.innerHTML += `<tr><td><span class="badge ${badgeClass}">${badgeText}</span></td><td><strong>${r.name}</strong></td><td>${desc}</td></tr>`;
      }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
       initRules();
    });
  </script>
</body>
</html>
